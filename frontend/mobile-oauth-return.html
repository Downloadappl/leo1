<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#18181b">
  <title>العودة إلى LeoGPT</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #18181b; color: #eee; font: 16px system-ui, sans-serif; text-align: center; }
    main { max-width: 440px; }
    a { display: inline-block; margin-top: 18px; padding: 13px 22px; border-radius: 999px; background: #b8f5d0; color: #101113; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>اكتمل تسجيل الدخول</h1>
    <p>إذا لم يفتح تطبيق LeoGPT تلقائيًا، اضغط للعودة إليه وإكمال تسجيل الدخول.</p>
    <a id="openApp" href="#">العودة إلى LeoGPT</a>
  </main>
  <script>
    const query = new URLSearchParams(location.search);
    const app = new URL('leogpt://auth/callback');
    for (const key of ['provider', 'access_token']) {
      const value = query.get(key);
      if (value) app.searchParams.set(key, value);
    }
    document.getElementById('openApp').href = app.toString();
  </script>
</body>
</html>
